.cut{grid-template-columns:.82fr 1.18fr!important;align-items:center!important}.character{height:570px!important;filter:none!important;align-items:center!important}.charGlow{display:none!important}.comms-unit{width:min(400px,92%);height:500px;position:relative;border:1px solid rgba(117,221,255,.22);border-radius:26px;background:radial-gradient(circle at 50% 38%,rgba(117,221,255,.10),transparent 29%),linear-gradient(180deg,rgba(7,31,45,.88),rgba(3,16,25,.94));box-shadow:inset 0 0 80px rgba(117,221,255,.035),0 26px 55px rgba(0,0,0,.24);overflow:hidden}.comms-unit:before{content:"";position:absolute;inset:18px;border:1px solid rgba(117,221,255,.08);border-radius:20px;background-image:linear-gradient(rgba(117,221,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(117,221,255,.035) 1px,transparent 1px);background-size:26px 26px}.comms-top{position:absolute;left:24px;right:24px;top:22px;display:flex;justify-content:space-between;align-items:center;font-size:8px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);z-index:4}.comms-live{display:flex;align-items:center;gap:7px;color:#bfeeff}.comms-live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(118,231,184,.45)}.holo-rings{position:absolute;width:290px;height:290px;border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%);border:1px solid rgba(117,221,255,.18);box-shadow:inset 0 0 40px rgba(117,221,255,.04)}.holo-rings:before,.holo-rings:after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(117,221,255,.14)}.holo-rings:before{inset:28px}.holo-rings:after{inset:62px;border-style:solid;border-color:rgba(255,201,111,.12)}.holo-bust{position:absolute;left:50%;top:48%;width:180px;height:235px;transform:translate(-50%,-50%);z-index:3}.holo-head{position:absolute;left:50%;top:16px;width:94px;height:112px;transform:translateX(-50%);border-radius:48% 48% 44% 44%;background:linear-gradient(180deg,rgba(117,221,255,.32),rgba(117,221,255,.10));border:1px solid rgba(117,221,255,.52);box-shadow:0 0 28px rgba(117,221,255,.12)}.holo-head:before{content:"";position:absolute;left:10px;right:10px;top:15px;height:48px;border-radius:50% 50% 35% 35%;border-top:9px solid rgba(3,16,25,.92);border-left:6px solid rgba(3,16,25,.82);border-right:6px solid rgba(3,16,25,.82)}.holo-head:after{content:"";position:absolute;left:24px;right:24px;top:64px;height:1px;background:rgba(117,221,255,.42);box-shadow:0 -14px 0 rgba(117,221,255,.14),0 14px 0 rgba(117,221,255,.14)}.holo-body{position:absolute;left:50%;bottom:0;width:170px;height:125px;transform:translateX(-50%);clip-path:polygon(18% 16%,37% 0,63% 0,82% 16%,100% 100%,0 100%);background:linear-gradient(180deg,rgba(117,221,255,.22),rgba(117,221,255,.07));border-bottom:1px solid rgba(117,221,255,.42)}.holo-body:before{content:"A7";position:absolute;left:50%;top:42px;transform:translateX(-50%);font-size:10px;font-weight:950;letter-spacing:.13em;color:var(--gold);border:1px solid rgba(255,201,111,.24);border-radius:6px;padding:5px 8px;background:rgba(4,17,25,.72)}.comms-name{position:absolute;left:24px;right:24px;bottom:24px;padding:13px 14px;border:1px solid rgba(117,221,255,.16);border-radius:12px;background:rgba(4,18,28,.70);z-index:4}.comms-name small{display:block;color:var(--muted);font-size:8px;letter-spacing:.12em;text-transform:uppercase}.comms-name b{display:block;margin-top:4px;font-size:15px;color:#dff5ff}.signal-bars{display:flex;gap:3px;position:absolute;right:16px;bottom:17px}.signal-bars span{display:block;width:4px;background:var(--cyan);border-radius:2px}.signal-bars span:nth-child(1){height:7px}.signal-bars span:nth-child(2){height:11px}.signal-bars span:nth-child(3){height:15px}.signal-bars span:nth-child(4){height:19px}
.floor{box-shadow:inset 0 0 70px rgba(0,0,0,.20)}.floor svg{height:330px!important}.room{fill:#092433!important;stroke:rgba(117,221,255,.25)!important}.room.hot{fill:#172a2c!important;stroke:rgba(255,201,111,.45)!important}.ghostline{stroke-width:2.5!important;stroke-dasharray:6 10!important}.activeRoute{stroke-width:5!important;stroke-dasharray:none!important;animation:none!important}.cone{fill:rgba(255,115,135,.045)!important;stroke:rgba(255,115,135,.15)!important}
.lasergrid{grid-template-columns:minmax(0,1fr) 350px!important}.laserbox{min-height:370px!important;background:linear-gradient(rgba(117,221,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(117,221,255,.035) 1px,transparent 1px),#061923!important;background-size:30px 30px!important;padding:20px!important}.laser-panel{height:100%;display:grid;grid-template-rows:auto repeat(3,1fr);gap:10px}.laser-header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 5px;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.lane{display:grid;grid-template-columns:66px 1fr 74px 74px;gap:10px;align-items:center;border:1px solid rgba(117,221,255,.10);border-radius:14px;background:rgba(255,255,255,.018);padding:10px 12px}.lane-id{font-size:10px;font-weight:950;color:#d9edf7}.lane-target{height:52px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;font-weight:950;font-size:12px;color:var(--muted);background:rgba(255,255,255,.02)}.lane-target.activeA,.lane-target.activeB{border-color:var(--gold);color:var(--gold);background:rgba(255,201,111,.07);box-shadow:inset 0 0 18px rgba(255,201,111,.04)}.lane-target.safe{border-color:rgba(118,231,184,.38);color:var(--green);background:rgba(118,231,184,.06)}.lane-path{height:2px;background:linear-gradient(90deg,var(--red),rgba(255,115,135,.16));position:relative}.lane-path:after{content:"";position:absolute;right:-1px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--red);transform:translateY(-50%)}
.circuitSvg{background:linear-gradient(rgba(117,221,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(117,221,255,.035) 1px,transparent 1px),#061923!important;background-size:28px 28px!important}.port{fill:#09293b!important;stroke:rgba(117,221,255,.32)!important;stroke-width:2.5!important}.wire{stroke-width:4!important}.wire.on{stroke-width:6!important}.branchIcon svg{width:78px!important;height:78px!important;display:block!important}.orb:before{animation-duration:28s!important}.orb:after{animation-duration:22s!important}.radar{animation-duration:8s!important}

<body>
<div class="bggrid"></div><div class="vignette"></div><div class="scan"></div>
<div id="app"><header class="top"><div class="brand"><div class="brandmark">Ω</div><div>Operação Nox<small>storytelling · princípio multiplicativo</small></div></div><div class="progress"><div class="pmeta"><span id="phase">Prólogo</span><span id="pct">0%</span></div><div class="ptrack"><span id="bar" style="width:0%"></span></div></div><div class="actions"><button class="tbtn" id="musicBtn">MÚSICA: ON</button><button class="tbtn" id="sfxBtn">SFX: ON</button><button class="tbtn" id="fullBtn">TELA CHEIA</button></div></header><main class="shell"><section class="stage"><div class="content" id="screen"></div></section></main></div><div class="toast" id="toast"></div>
<script>
const S={scene:'prologue',music:true,sfx:true,identity:null,entry:null,route:null,explored:new Set(),laser:['','',''],laserCount:false,laserSafe:false,vault:null,code:[],tries:3,codeSolved:false,codeCount:false,circuit:{i:null,r:null,o:null},circuitSolved:false,circuitCount:false,alerts:0,points:0,puzzles:new Set(),transfer:false};
const ORDER=['prologue','cut1','identity','cp1','cut2','routes','cp2','laser','cut3','vaultChoice','vaultCode','vaultCircuit','cp3','cut4','synthesis','formal','transfer','ending'];
const LABEL={prologue:'Prólogo',cut1:'Aurora',identity:'Identidade',cp1:'Registro 01',cut2:'Aurora',routes:'Infiltração',cp2:'Registro 02',laser:'Segurança',cut3:'Aurora',vaultChoice:'Cofre',vaultCode:'Senha',vaultCircuit:'Circuito',cp3:'Registro 03',cut4:'Aurora',synthesis:'Síntese',formal:'Formalização',transfer:'Transferência',ending:'Epílogo'};
const el=id=>document.getElementById(id),screen=()=>el('screen');
function aurora(){return `<div class="comms-unit"><div class="comms-top"><span>TRANSMISSÃO CRIPTOGRAFADA</span><span class="comms-live"><i></i> CANAL A7</span></div><div class="holo-rings"></div><div class="holo-bust"><div class="holo-head"></div><div class="holo-body"></div></div><div class="comms-name"><small>Operadora de campo</small><b>DIRETORA AURORA</b><div class="signal-bars"><span></span><span></span><span></span><span></span></div></div></div>`}
function icon(t){const s='fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';return t==='tech'?`<svg class="icon" viewBox="0 0 100 100" ${s}><circle cx="50" cy="28" r="12"/><path d="M29 80c2-20 7-32 21-32s19 12 21 32M39 51l11 12 11-12M72 26l8 8m-8 0 8-8"/></svg>`:t==='exec'?`<svg class="icon" viewBox="0 0 100 100" ${s}><circle cx="50" cy="27" r="12"/><path d="M28 81c3-22 10-33 22-33s19 11 22 33M40 49l10 13 10-13"/><rect x="67" y="56" width="17" height="13" rx="2"/></svg>`:t==='courier'?`<svg class="icon" viewBox="0 0 100 100" ${s}><circle cx="44" cy="28" r="11"/><path d="M24 81c3-21 8-32 20-32 14 0 20 11 24 32M56 49l14 8 9 23"/><rect x="62" y="63" width="21" height="16" rx="2"/></svg>`:t==='roof'?`<svg class="icon" viewBox="0 0 100 100" ${s}><path d="M20 78h60M30 78V36h40v42M26 36h48L66 24H34zM50 24V12"/></svg>`:t==='garage'?`<svg class="icon" viewBox="0 0 100 100" ${s}><path d="M18 78h64V34H18zM30 58l6-12h28l6 12M28 58h44v15H28z"/><circle cx="37" cy="73" r="5"/><circle cx="63" cy="73" r="5"/></svg>`:t==='archive'?`<svg class="icon" viewBox="0 0 100 100" ${s}><rect x="25" y="18" width="50" height="64" rx="4"/><path d="M34 31h32M34 44h32M34 57h32M34 70h20"/></svg>`:t==='server'?`<svg class="icon" viewBox="0 0 100 100" ${s}><rect x="26" y="17" width="48" height="66" rx="3"/><path d="M26 34h48M26 50h48M26 66h48"/><circle cx="34" cy="26" r="2"/><circle cx="34" cy="42" r="2"/></svg>`:`<svg class="icon" viewBox="0 0 100 100" ${s}><path d="M21 78h58M28 78V25h44v53M37 78V40h26v38M44 50h12M44 59h12M44 68h12"/></svg>`}
function updateTop(){const i=ORDER.indexOf(S.scene),p=Math.round(i/(ORDER.length-1)*100);el('phase').textContent=LABEL[S.scene]||'';el('pct').textContent=p+'%';el('bar').style.width=p+'%';setIntensity(S.scene)}
function go(scene){S.scene=scene;render();updateTop();window.scrollTo({top:0,behavior:'smooth'});sfx(440,.035)}
function cut(text,next,label){screen().innerHTML=`<div class="cut"><div class="character"><div class="charGlow"></div>${aurora()}</div><div class="dialog"><div class="eyebrow">Cut-scene · Canal A7</div><div style="height:12px"></div><div class="name">Diretora Aurora</div><div class="dialogbox"><div class="dialogtext" id="typed"></div><div class="btnrow"><button class="btn primary" id="nextCut" disabled>${label}</button></div></div></div></div>`;typewrite(text,()=>{el('nextCut').disabled=false;el('nextCut').onclick=()=>go(next)})}
function typewrite(text,done){let i=0,t=el('typed');const id=setInterval(()=>{t.textContent=text.slice(0,i++);if(i>text.length){clearInterval(id);t.innerHTML=text+' <span class="cursor"></span>';done();sfx(700,.03)}},18)}
function render(){if(S.scene==='prologue')return prologue();if(S.scene==='cut1')return cut('Agente, vou guiá-lo pelo canal A7. Não quero que você memorize uma regra. Quero que perceba um padrão enquanto toma decisões. Em Nox, cada etapa abre novas possibilidades. Observe como elas se combinam.','identity','RECEBER IDENTIDADES');if(S.scene==='identity')return identity();if(S.scene==='cp1')return cp1();if(S.scene==='cut2')return cut('Boa escolha. Agora temos duas entradas e três corredores. Teste algumas rotas, mas não desperdice tempo tentando todas. Quero que você descubra uma forma de prever quantas existem.','routes','ABRIR PLANTA TÁTICA');if(S.scene==='routes')return routes();if(S.scene==='cp2')return cp2();if(S.scene==='laser')return laser();if(S.scene==='cut3')return cut('A rede interna está quase neutralizada. O cofre pode ser vencido de duas maneiras reais: quebrar a senha ou reprogramar o circuito. Você escolherá um único caminho — e essa escolha também cria possibilidades.','vaultChoice','IR AO COFRE');if(S.scene==='vaultChoice')return vaultChoice();if(S.scene==='vaultCode')return vaultCode();if(S.scene==='vaultCircuit')return vaultCircuit();if(S.scene==='cp3')return cp3();if(S.scene==='cut4')return cut('Arquivo Ω recuperado. Agora vem a parte mais importante: reconstruir a operação. Você viu vários números nos puzzles, mas quais escolhas realmente definiram maneiras diferentes de completar a missão?','synthesis','ABRIR RELATÓRIO');if(S.scene==='synthesis')return synthesis();if(S.scene==='formal')return formal();if(S.scene==='transfer')return transfer();return ending()}
function prologue(){screen().innerHTML=`<div class="hero"><div><div class="eyebrow">Prólogo · 23:47 · Setor restrito</div><h1>O arquivo que não poderia desaparecer.</h1><p class="lead">O Instituto Orion sofreu uma invasão. O <span class="gold">Arquivo Ω</span>, capaz de expor toda a rede de agentes, foi levado para o Edifício Nox. A missão não será vencida pela força, mas por decisões.</p><div class="btnrow"><button class="btn primary" onclick="startGame()">INICIAR OPERAÇÃO</button></div></div><div class="heroVisual"><div class="orb"><div class="radar"></div><div class="orbcore"><div><b>Ω</b><span>classificação máxima</span></div></div></div></div></div>`}
const ids=[{id:'tech',name:'Técnico de manutenção',desc:'Credencial cinza e maleta elétrica.',icon:'tech'},{id:'exec',name:'Consultor executivo',desc:'Terno e autorização corporativa.',icon:'exec'},{id:'courier',name:'Mensageiro noturno',desc:'Bolsa lacrada e passe logístico.',icon:'courier'}];
function identity(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Capítulo I · Cobertura</div><h2>Não basta escolher. É preciso deduzir.</h2><p class="lead">As três identidades são possibilidades reais, mas apenas uma minimiza o risco.</p></div><div class="badge">Puzzle de dedução</div></div><div class="card"><details class="hintbox"><summary class="hintbtn">REVELAR DICAS DE IDENTIDADE</summary><div class="hintcontent"><p class="hintcaption">Abra apenas se precisar de ajuda para deduzir a melhor cobertura.</p><div class="clues"><div class="clue">01 · O chefe da recepção conhece todos os <b>consultores executivos</b> autorizados.</div><div class="clue">02 · Todo <b>mensageiro</b> está passando por inspeção manual.</div><div class="clue">03 · Uma equipe de <b>manutenção elétrica</b> foi chamada e ainda não chegou.</div></div></div></details></div><div class="card"><div class="choicegrid">${ids.map(x=>choice(x,'identity')).join('')}</div><div class="feedback" id="ifb">Tente decidir sozinho. Se precisar, revele as dicas.</div><div class="risk"><div class="riskbar"><span id="rbar"></span></div><div class="riskval" id="rval">RISCO: —</div></div><div class="btnrow"><button class="btn primary" id="inext" disabled onclick="go('cp1')">REGISTRAR DESCOBERTA</button></div></div>`}
function choice(x,key){return `<button class="choice ${S[key]===x.id?'selected':''}" onclick="pick('${key}','${x.id}')"><div class="choiceicon">${icon(x.icon)}</div><h3>${x.name}</h3><p>${x.desc}</p></button>`}
function pick(k,v){S[k]=v;if(k==='identity'){identity();const fb=el('ifb'),bar=el('rbar'),rv=el('rval');if(v==='tech'){fb.className='feedback good';fb.textContent='Correto. A identidade preenche a lacuna deixada pela chamada de manutenção.';bar.style.width='16%';rv.textContent='RISCO: 16%';el('inext').disabled=false;S.puzzles.add('identity');S.points=Math.max(S.points,100);sfx(850,.06)}else{fb.className='feedback bad';fb.textContent='Essa identidade entra em conflito com as informações interceptadas.';bar.style.width='78%';rv.textContent='RISCO: 78%';S.alerts++;S.points=Math.max(0,S.points-10);sfx(210,.05)}}else routes()}
function cp1(){screen().innerHTML=cp('Arquivo da missão · Registro 01','Primeiro dado construído.','Antes de descobrir qual identidade era mais segura, existiam <b class="gold">3 possibilidades</b> de cobertura. Guarde esse número.','01','Identidade do agente','3','cut2')}
function cp(kicker,title,text,no,label,val,next,extra=''){return `<div class="checkpoint"><div class="checkcard"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p class="lead" style="font-size:15px">${text}</p><div class="record"><div class="recno">${no}</div><div><small>Etapa</small><b>${label}</b></div><div class="recval">${val}</div></div>${extra}<div class="btnrow"><button class="btn goldbtn" onclick="go('${next}')">CONTINUAR</button></div></div></div>`}
const entries=[{id:'roof',name:'Cobertura técnica',desc:'Entrada pelo 19º andar.',icon:'roof'},{id:'garage',name:'Garagem subterrânea',desc:'Entrada pela logística.',icon:'garage'}],rs=[{id:'archive',name:'Corredor dos Arquivos',desc:'Curto e silencioso.',icon:'archive'},{id:'server',name:'Sala de Servidores',desc:'Ruído e sensores térmicos.',icon:'server'},{id:'service',name:'Passagem de Serviço',desc:'Estreita e pouco monitorada.',icon:'service'}];
function routes(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Capítulo II · Infiltração</div><h2>Explore algumas rotas. Depois preveja o total.</h2><p class="lead">Existem <span class="gold">2 entradas</span> e, a partir de cada uma, <span class="gold">3 corredores</span>. Teste combinações e procure um padrão.</p></div><div class="badge">Descoberta guiada</div></div><div class="card"><div class="choicegrid two">${entries.map(x=>choice(x,'entry')).join('')}</div><div style="height:10px"></div><div class="choicegrid">${rs.map(x=>choice(x,'route')).join('')}</div><div class="btnrow"><button class="btn primary" ${S.entry&&S.route?'':'disabled'} onclick="explore()">TESTAR ESTA ROTA</button></div><div class="feedback" id="rfb">Escolha uma entrada e um corredor.</div></div>${floorHTML()}<div class="card"><h3>Registro de exploração</h3><p class="lead" style="font-size:14px;max-width:none">Em vez de listar todas as combinações, observe apenas as rotas que você já testou e tente perceber o padrão entre entrada e corredor.</p><div class="feedback">Rotas testadas até agora: <b class="gold">${S.explored.size}</b></div>${S.explored.size>=3&&!S.routePredicted?`<div class="answerarea"><div><label class="muted" style="font-size:10px">Sem testar as demais, quantas rotas existem ao todo?</label><input id="pred" class="answer" inputmode="numeric" placeholder="?"></div><button class="btn goldbtn" onclick="predict()">PREVER TOTAL</button></div><div class="feedback" id="pfb"></div>`:''}${S.routePredicted?`<div class="definition"><b>O que você percebeu:</b> para cada uma das 2 entradas existem 3 corredores. Então 3 + 3 = 6. A multiplicação resume essa repetição: <b class="gold">2 × 3 = 6</b>.</div><div class="btnrow"><button class="btn primary" onclick="go('cp2')">REGISTRAR A DESCOBERTA</button></div>`:''}</div>`;drawFloor()}
function floorHTML(){return `<div class="floor"><div class="floorhead"><span>Planta do <b>Edifício Nox</b></span><span id="fstatus">ROTA NÃO DEFINIDA</span></div><svg viewBox="0 0 1120 360"><defs><linearGradient id="routeGrad"><stop offset="0" stop-color="#75ddff"/><stop offset="1" stop-color="#ffc96f"/></linearGradient></defs><rect x="20" y="20" width="1080" height="320" rx="22" fill="#061923" stroke="rgba(117,221,255,.12)"/><path d="M230 95H390M230 265H390M550 95H845M550 180H845M550 265H845" class="ghostline"/><path id="floorPath" class="activeRoute" d="" style="display:none"/><rect x="70" y="55" width="160" height="80" rx="16" class="room"/><text x="150" y="100" text-anchor="middle" class="rlabel">COBERTURA</text><rect x="70" y="225" width="160" height="80" rx="16" class="room"/><text x="150" y="270" text-anchor="middle" class="rlabel">GARAGEM</text><rect x="390" y="55" width="160" height="80" rx="16" class="room"/><text x="470" y="100" text-anchor="middle" class="rlabel">ARQUIVOS</text><rect x="390" y="140" width="160" height="80" rx="16" class="room"/><text x="470" y="185" text-anchor="middle" class="rlabel">SERVIDORES</text><rect x="390" y="225" width="160" height="80" rx="16" class="room"/><text x="470" y="270" text-anchor="middle" class="rlabel">SERVIÇO</text><rect x="845" y="125" width="190" height="110" rx="22" class="room hot"/><text x="940" y="185" text-anchor="middle" class="rlabel" style="fill:#ffc96f">SETOR CENTRAL</text><polygon points="320,50 450,120 320,135" class="cone"/><circle cx="320" cy="92" r="7" class="cam"/><polygon points="650,220 820,150 820,290" class="cone"/><circle cx="650" cy="220" r="7" class="cam"/></svg></div>`}
const pts={roof:[230,95],garage:[230,265],archive:[550,95],server:[550,180],service:[550,265],center:[845,180]};
function drawFloor(){if(!(S.entry&&S.route)||!el('floorPath'))return;const a=pts[S.entry],b=pts[S.route],c=pts.center;const d=`M ${a[0]} ${a[1]} L ${b[0]-18} ${b[1]} L ${b[0]} ${b[1]} L ${c[0]} ${c[1]}`;el('floorPath').setAttribute('d',d);el('floorPath').style.display='block';el('fstatus').textContent=(S.entry==='roof'?'COBERTURA':'GARAGEM')+' → '+({archive:'ARQUIVOS',server:'SERVIDORES',service:'SERVIÇO'}[S.route])}
function matrixHTML(){let h='<div class="mcell mhead"></div><div class="mcell mhead">Arquivos</div><div class="mcell mhead">Servidores</div><div class="mcell mhead">Serviço</div>';[['roof','Cobertura'],['garage','Garagem']].forEach(e=>{h+=`<div class="mcell mhead">${e[1]}</div>`;['archive','server','service'].forEach(r=>{const k=e[0]+'-'+r,seen=S.explored.has(k);h+=`<div class="mcell ${seen?'discovered':''}">${seen?'DESCOBERTA':'—'}</div>`})});return h}
function explore(){if(!(S.entry&&S.route))return;S.explored.add(S.entry+'-'+S.route);S.points+=10;const risky=(S.entry==='roof'&&S.route==='server')||(S.entry==='garage'&&S.route==='archive');if(risky){S.alerts++;S.points-=5}routes();el('rfb').className='feedback '+(risky?'bad':'good');el('rfb').textContent=risky?'A rota existe, mas é arriscada. Para a contagem, continua sendo uma possibilidade.':'Rota registrada. Observe como uma mesma entrada se combina com corredores diferentes.';sfx(risky?210:720,.04)}
function predict(){const v=Number(el('pred').value);if(v===6){S.routePredicted=true;S.puzzles.add('routes');S.points+=120;routes();sfx(900,.08)}else{el('pfb').className='feedback bad';el('pfb').textContent='Quantos corredores existem para cada uma das 2 entradas?';S.alerts++;S.points-=8;sfx(210,.05)}}
function cp2(){screen().innerHTML=cp('Arquivo da missão · Registro 02','As possibilidades se ramificam.','Você percebeu que cada uma das 2 entradas podia ser combinada com os mesmos 3 corredores.','02','2 entradas × 3 corredores','6','laser')}
function laser(){const safeNow=S.laser.join('')==='ABA';const lane=(i)=>{const v=S.laser[i];return `<div class="lane"><div class="lane-id">SETOR ${i+1}</div><div class="lane-path"></div><div class="lane-target ${v==='A'?'activeA':''} ${safeNow&&v==='A'?'safe':''}">A</div><div class="lane-target ${v==='B'?'activeB':''} ${safeNow&&v==='B'?'safe':''}">B</div></div>`};screen().innerHTML=`<div class="head"><div><div class="eyebrow">Capítulo III · Rede de segurança</div><h2>O padrão aparece novamente.</h2><p class="lead">Três setores de laser podem ser desviados para <span class="gold">A</span> ou <span class="gold">B</span>. Conte as configurações e encontre a segura.</p></div><div class="badge">Puzzle + contagem</div></div><div class="lasergrid"><div class="laserbox"><div class="laser-panel"><div class="laser-header"><span>REDE ÓPTICA · NOX</span><span>${safeNow?'CONFIGURAÇÃO SEGURA':'AGUARDANDO ROTEAMENTO'}</span></div>${[0,1,2].map(lane).join('')}</div></div><div><div class="card"><details class="hintbox"><summary class="hintbtn">REVELAR DICAS DOS LASERS</summary><div class="hintcontent"><p class="hintcaption">Tente montar a configuração primeiro. Se travar, abra as pistas.</p><div class="clues"><div class="clue">01 · Setor 1 deve ir para <b>A</b>.</div><div class="clue">02 · Setor 2 deve ser diferente do Setor 3.</div><div class="clue">03 · Setor 3 deve ir para <b>A</b>.</div></div></div></details></div>${[0,1,2].map(i=>`<div class="switchrow"><b>Setor ${i+1}</b><div class="toggle"><button class="${S.laser[i]==='A'?'active':''}" onclick="laserSet(${i},'A')">A</button><button class="${S.laser[i]==='B'?'active':''}" onclick="laserSet(${i},'B')">B</button></div></div>`).join('')}</div></div><div class="card"><div class="answerarea"><div><label class="muted" style="font-size:10px">Antes das pistas, quantas configurações eram possíveis?</label><input id="lcount" class="answer" inputmode="numeric" placeholder="?"></div><button class="btn goldbtn" onclick="laserCheck()">VERIFICAR</button></div><div class="feedback" id="lfb">Monte a configuração ou revele as dicas, se precisar.</div><div class="btnrow"><button class="btn primary" ${S.laserSafe&&S.laserCount?'':'disabled'} onclick="go('cut3')">DESLIGAR REDE</button></div></div>`}
function laserSet(i,v){S.laser[i]=v;S.laserSafe=S.laser.join('')==='ABA';laser();if(S.laser.every(Boolean)){el('lfb').className='feedback '+(S.laserSafe?'good':'bad');el('lfb').textContent=S.laserSafe?'Configuração segura encontrada: A-B-A.':'Essa configuração não atende às três pistas.';if(!S.laserSafe){S.alerts++;S.points-=4}}}
function laserCheck(){const ok=Number(el('lcount').value)===8;if(ok){S.laserCount=true;S.puzzles.add('laser');S.points+=80;laser();el('lfb').className='feedback good';el('lfb').textContent='Correto: 2 × 2 × 2 = 8 configurações.';sfx(850,.06)}else{el('lfb').className='feedback bad';el('lfb').textContent='Cada um dos 3 setores oferece 2 escolhas.';S.alerts++;S.points-=8}}
function vaultChoice(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Capítulo IV · Cofre Ω</div><h2>Há duas maneiras de abrir o cofre.</h2><p class="lead">Escolha uma. Essa decisão cria uma nova etapa real da missão.</p></div><div class="badge">Escolha narrativa</div></div><div class="branches"><button class="branch" onclick="S.vault='code';go('vaultCode')"><div class="branchIcon"><svg viewBox="0 0 120 120" fill="none" stroke="#75ddff" stroke-width="2"><rect x="20" y="25" width="80" height="70" rx="12"/><circle cx="60" cy="60" r="20"/><path d="M60 40v10M60 70v10M40 60h10M70 60h10"/></svg></div><h3>Rota A — Quebrar a senha</h3><p>Resolva uma sequência lógica e conte quantas senhas existiam antes das pistas.</p><span class="tag">lógica</span><span class="tag">sequências</span></button><button class="branch" onclick="S.vault='circuit';go('vaultCircuit')"><div class="branchIcon"><svg viewBox="0 0 120 120" fill="none" stroke="#ffc96f" stroke-width="2"><circle cx="22" cy="60" r="8"/><circle cx="60" cy="35" r="8"/><circle cx="60" cy="85" r="8"/><circle cx="98" cy="60" r="8"/><path d="M30 60h15l8-20M30 60h15l8 20M68 35l22 20M68 85l22-20"/></svg></div><h3>Rota B — Reprogramar o circuito</h3><p>Escolha entrada, relé e saída e encontre uma configuração segura.</p><span class="tag">circuitos</span><span class="tag">produto</span></button></div>`}
function vaultCode(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Cofre Ω · Rota A</div><h2>Quebre a senha.</h2><p class="lead">4 posições, cada uma com ◇ ou ○. Três tentativas.</p></div><div class="badge">Senha lógica</div></div><div class="card"><details class="hintbox"><summary class="hintbtn">REVELAR DICAS DA SENHA</summary><div class="hintcontent"><p class="hintcaption">Você pode tentar deduzir a sequência sem ajuda e abrir as dicas só depois.</p><div class="clues"><div class="clue">01 · O primeiro símbolo é <b>◇</b>.</div><div class="clue">02 · O segundo é <b>○</b>.</div><div class="clue">03 · O terceiro é diferente do segundo.</div><div class="clue">04 · O último é <b>○</b>.</div></div></div></details></div><div class="card"><div class="codebox">${[0,1,2,3].map(i=>S.code[i]||'_').join(' ')}</div><div class="codegrid"><button class="codebtn" onclick="codeAdd('◇')">◇</button><button class="codebtn" onclick="codeAdd('○')">○</button><button class="codebtn" onclick="S.code=[];vaultCode()">LIMPAR</button><button class="codebtn" onclick="codeTry()">TESTAR</button></div><div class="feedback">Tentativas restantes: ${Math.max(S.tries,0)}</div><div class="answerarea"><div><label class="muted" style="font-size:10px">Antes das pistas, quantas senhas existiam?</label><input id="ccount" class="answer" inputmode="numeric" placeholder="?"></div><button class="btn goldbtn" onclick="codeCount()">VERIFICAR</button></div><div class="feedback" id="cfb"></div><div class="btnrow"><button class="btn primary" ${S.codeSolved&&S.codeCount?'':'disabled'} onclick="go('cp3')">ABRIR COFRE</button></div></div>`}
function codeAdd(x){if(S.code.length<4)S.code.push(x);vaultCode();sfx(590,.03)}function codeTry(){if(S.code.join('')==='◇○◇○'){S.codeSolved=true;S.puzzles.add('vault');S.points+=120;vaultCode();el('cfb').className='feedback good';el('cfb').textContent='Senha correta.';sfx(920,.08)}else{S.tries--;S.alerts++;S.points-=12;S.code=[];if(S.tries<=0){S.codeSolved=true;S.puzzles.add('vault')}vaultCode();el('cfb').className='feedback bad';el('cfb').textContent=S.tries<=0?'Aurora ativou um bypass. Você pode continuar, mas perdeu pontos.':'Senha incorreta.';sfx(180,.05)}}function codeCount(){if(Number(el('ccount').value)===16){S.codeCount=true;S.points+=80;vaultCode();el('cfb').className='feedback good';el('cfb').textContent='Correto: 2 × 2 × 2 × 2 = 16.';sfx(850,.06)}else{el('cfb').className='feedback bad';el('cfb').textContent='Quatro posições, duas possibilidades em cada.';S.alerts++;S.points-=8}}
function vaultCircuit(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Cofre Ω · Rota B</div><h2>Reprograme o circuito.</h2><p class="lead">3 entradas, 2 relés e 2 saídas. Conte as configurações e encontre a segura.</p></div><div class="badge">Circuito combinatório</div></div><div class="circuitgrid"><svg class="circuitSvg" viewBox="0 0 700 360"><defs><linearGradient id="wireGrad"><stop offset="0" stop-color="#75ddff"/><stop offset="1" stop-color="#ffc96f"/></linearGradient></defs><path id="w1" class="wire"/><path id="w2" class="wire"/>${[['in1',90,90,'E1'],['in2',90,180,'E2'],['in3',90,270,'E3'],['rel1',350,125,'R1'],['rel2',350,235,'R2'],['out1',610,125,'S1'],['out2',610,235,'S2']].map(x=>`<circle id="${x[0]}" cx="${x[1]}" cy="${x[2]}" r="25" class="port"/><text x="${x[1]}" y="${x[2]+4}" text-anchor="middle" class="clabel">${x[3]}</text>`).join('')}</svg><div><div class="cgroup"><small>Entrada</small><div class="copts">${['E1','E2','E3'].map(v=>cbtn('i',v)).join('')}</div></div><div class="cgroup"><small>Relé</small><div class="copts two">${['R1','R2'].map(v=>cbtn('r',v)).join('')}</div></div><div class="cgroup"><small>Saída</small><div class="copts two">${['S1','S2'].map(v=>cbtn('o',v)).join('')}</div></div><details class="hintbox" style="margin-top:12px"><summary class="hintbtn">REVELAR DICAS DO CIRCUITO</summary><div class="hintcontent"><p class="hintcaption">As pistas do circuito ficam escondidas para não entregar cedo demais.</p><div class="clues"><div class="clue">01 · Entrada segura não é <b>E1</b>.</div><div class="clue">02 · Relé correto é <b>R2</b>.</div><div class="clue">03 · Se usar E3, a saída deve ser <b>S1</b>.</div></div></div></details></div></div><div class="card"><div class="answerarea"><div><label class="muted" style="font-size:10px">Quantas configurações existem no total?</label><input id="circount" class="answer" inputmode="numeric" placeholder="?"></div><button class="btn goldbtn" onclick="circuitCheck()">TESTAR</button></div><div class="feedback" id="cirfb">Escolha entrada, relé e saída. Revele as dicas só se precisar.</div><div class="btnrow"><button class="btn primary" ${S.circuitSolved&&S.circuitCount?'':'disabled'} onclick="go('cp3')">ABRIR COFRE</button></div></div>`;drawCircuit()}
function cbtn(k,v){return `<button class="${S.circuit[k]===v?'active':''}" onclick="S.circuit.${k}='${v}';vaultCircuit()">${v}</button>`}function drawCircuit(){if(!el('w1'))return;const p={E1:[90,90],E2:[90,180],E3:[90,270],R1:[350,125],R2:[350,235],S1:[610,125],S2:[610,235]},c=S.circuit;if(c.i&&c.r){el('w1').setAttribute('d',`M${p[c.i][0]} ${p[c.i][1]}L${p[c.r][0]} ${p[c.r][1]}`);el('w1').classList.add('on')}if(c.r&&c.o){el('w2').setAttribute('d',`M${p[c.r][0]} ${p[c.r][1]}L${p[c.o][0]} ${p[c.o][1]}`);el('w2').classList.add('on')}}function circuitCheck(){const count=Number(el('circount').value)===12,safe=S.circuit.i==='E3'&&S.circuit.r==='R2'&&S.circuit.o==='S1';S.circuitCount=count;S.circuitSolved=safe;if(count&&safe){S.puzzles.add('vault');S.points+=200;vaultCircuit();el('cirfb').className='feedback good';el('cirfb').textContent='Perfeito: 3 × 2 × 2 = 12, e E3 → R2 → S1 é segura.';sfx(920,.08)}else{el('cirfb').className='feedback bad';el('cirfb').textContent=!count?'A contagem deve usar 3 entradas, 2 relés e 2 saídas.':'A contagem está correta, mas a combinação não atende às pistas.';S.alerts++;S.points-=10}}
function cp3(){screen().innerHTML=cp('Arquivo da missão · Registro 03','O cofre tinha duas rotas de destrave.','Você escolheu uma, mas a missão poderia seguir por <b class="gold">2 métodos</b>: senha ou circuito.','03','Método de abertura do cofre','2','cut4','<div class="definition"><b>Importante:</b> 16 senhas e 12 circuitos são subproblemas usados para praticar o princípio. Na contagem das estratégias completas da missão, o que importa é que a etapa do cofre tinha 2 maneiras de ser vencida.</div>')}
function synthesis(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Relatório final · Conhecimento construído</div><h2>Junte o que a história construiu.</h2><p class="lead">Cada etapa da missão oferecia escolhas que podiam se combinar com as etapas seguintes.</p></div><div class="badge">Síntese</div></div><div class="synth"><div class="synthstage"><small>Identidade</small><b>3</b><span>formas</span></div><div class="synthstage"><small>Entrada</small><b>2</b><span>formas</span></div><div class="synthstage"><small>Corredor</small><b>3</b><span>caminhos</span></div><div class="synthstage"><small>Cofre</small><b>2</b><span>métodos</span></div></div><div class="card" style="margin-top:14px"><div class="answerarea"><div><label class="muted" style="font-size:10px">Quantas estratégias completas a operação poderia ter?</label><input id="mtotal" class="answer" inputmode="numeric" placeholder="?"></div><button class="btn goldbtn" onclick="missionTotal()">CALCULAR</button></div><div class="feedback" id="mfb">Combine as escolhas das quatro etapas.</div></div><div id="synthReveal"></div>`}
function missionTotal(){if(Number(el('mtotal').value)===36){S.points+=150;el('mfb').className='feedback good';el('mfb').textContent='Correto. 3 × 2 × 3 × 2 = 36.';el('synthReveal').innerHTML=`<div class="bigeq"><div class="eq">3 <span class="op">×</span> 2 <span class="op">×</span> 3 <span class="op">×</span> 2 <span class="op">=</span> <span class="gold">36</span></div></div><div class="tree"><svg id="treeSvg" viewBox="0 0 760 290"></svg></div><div class="definition"><b>Por que multiplicar?</b> Porque cada escolha de uma etapa pode ser combinada com todas as escolhas das etapas seguintes. Multiplicar é uma forma compacta de contar as ramificações.</div><div class="btnrow"><button class="btn primary" onclick="go('formal')">FORMALIZAR O PRINCÍPIO</button></div>`;tree();sfx(960,.09)}else{el('mfb').className='feedback bad';el('mfb').textContent='Multiplique as possibilidades de identidade, entrada, corredor e cofre.';S.alerts++;S.points-=8}}
function tree(){const svg=el('treeSvg'),cols=[{x:30,n:1,l:'início'},{x:180,n:3,l:'3'},{x:340,n:6,l:'6'},{x:515,n:9,l:'18'},{x:720,n:12,l:'36'}],ys=n=>n===1?[145]:Array.from({length:n},(_,i)=>24+244*(i/(n-1)));let e='',nodes='';cols.forEach((c,ci)=>{const y=ys(c.n);if(ci){const py=ys(cols[ci-1].n);y.forEach((yy,i)=>{const pi=Math.floor(i*py.length/y.length);e+=`<line class="tedge ${i===0?'hot':''}" x1="${cols[ci-1].x}" y1="${py[pi]}" x2="${c.x}" y2="${yy}"/>`})}y.forEach((yy,i)=>nodes+=`<circle class="tnode ${i===0?'hot':''}" cx="${c.x}" cy="${yy}" r="${ci===4?5:7}"/>`);nodes+=`<text class="tcount" x="${c.x}" y="282" text-anchor="middle">${c.l}</text>`});svg.innerHTML=e+nodes}
function formal(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Formalização matemática</div><h2>Princípio Multiplicativo.</h2><p class="lead">Você usou a ideia antes de receber o nome.</p></div><div class="badge">Conceito</div></div><div class="card"><div class="definition" style="font-size:16px"><b>Princípio Multiplicativo:</b> se uma tarefa é realizada em etapas sucessivas, com <i>a</i> possibilidades para a primeira, <i>b</i> para a segunda, <i>c</i> para a terceira, e assim por diante, então o total de maneiras é o produto dessas quantidades.</div><div class="bigeq"><div class="eq"><span class="gold">a</span> <span class="op">×</span> <span class="gold">b</span> <span class="op">×</span> <span class="gold">c</span> <span class="op">×</span> ⋯</div></div><div class="record"><div class="recno">A</div><div><small>Quando usar</small><b>Quando a situação é formada por escolhas ou etapas sucessivas.</b></div><div class="recval">×</div></div><div class="record"><div class="recno">B</div><div><small>Ideia central</small><b>Cada escolha anterior pode combinar com as opções da etapa seguinte.</b></div><div class="recval">↳</div></div><div class="record"><div class="recno">C</div><div><small>Vantagem</small><b>Evita listar todas as possibilidades.</b></div><div class="recval">36</div></div><div class="btnrow"><button class="btn goldbtn" onclick="go('transfer')">TESTAR FORA DA HISTÓRIA</button></div></div>`}
function transfer(){screen().innerHTML=`<div class="head"><div><div class="eyebrow">Transferência · Fora da missão</div><h2>Agora sem espionagem.</h2><p class="lead">Se a ideia foi aprendida, ela deve funcionar em outros contextos.</p></div><div class="badge">Aplicação</div></div><div class="transfer">${problem(1,'Roupas','4 camisetas e 3 calças. Quantos conjuntos podem ser formados?')}${problem(2,'Cardápio','2 pratos, 3 bebidas e 2 sobremesas. Quantas refeições completas?')}${problem(3,'Código','Uma letra entre A, B ou C e um algarismo entre 1, 2, 3 ou 4. Quantos códigos?')}</div><div class="btnrow"><button class="btn primary" onclick="transferCheck()">VERIFICAR AS TRÊS</button><button class="btn goldbtn" id="tNext" disabled onclick="go('ending')">ENCERRAR OPERAÇÃO</button></div>`}
function problem(i,t,p){return `<div class="problem"><div class="problemNo">Situação 0${i}</div><h3>${t}</h3><p>${p}</p><input id="p${i}" inputmode="numeric" placeholder="?"><div class="pf" id="pf${i}"></div></div>`}function transferCheck(){const a=[12,12,12];let ok=0;for(let i=1;i<=3;i++){const f=el('pf'+i),v=Number(el('p'+i).value);if(v===a[i-1]){ok++;f.className='pf good';f.textContent='Correto.'}else{f.className='pf bad';f.textContent=i===1?'4 × 3':i===2?'2 × 3 × 2':'3 × 4'}}if(ok===3){S.transfer=true;S.points+=150;el('tNext').disabled=false;toast('Transferência concluída: 3/3.');sfx(980,.1)}else{S.alerts++;S.points-=5}}
function ending(){screen().innerHTML=`<div class="checkpoint"><div class="checkcard"><div class="eyebrow">Epílogo · Operação concluída</div><h2>Você descobriu a regra antes da definição.</h2><p class="lead" style="font-size:15px">A história serviu para criar a necessidade do conceito: experimentar escolhas, perceber ramificações, antecipar resultados e só então formalizar.</p><div class="scoregrid"><div class="score"><span>Puzzles</span><b>${S.puzzles.size}</b></div><div class="score"><span>Alertas</span><b>${S.alerts}</b></div><div class="score"><span>Ramo do cofre</span><b style="font-size:18px">${S.vault==='code'?'SENHA':'CIRCUITO'}</b></div><div class="score"><span>Pontuação</span><b>${Math.max(0,S.points)}</b></div></div><div class="btnrow"><button class="btn goldbtn" onclick="location.reload()">JOGAR NOVAMENTE</button><button class="btn ghost" onclick="go('synthesis')">REVER SÍNTESE</button></div></div></div>`}
function startGame(){musicStart();go('cut1')}
/* Original procedural espionage ambience. No copyrighted melody or audio file. */
let ac=null,mtimer=null,mgain=null,mstep=0,intensity=1;function audio(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)()}function tone(f,d,v,type,dest){audio();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(dest||ac.destination);o.start();o.stop(ac.currentTime+d+.02)}function musicStart(){if(!S.music)return;audio();if(mtimer)return;mgain=ac.createGain();mgain.gain.value=.052;mgain.connect(ac.destination);const notes=[82.41,98,110,92.5,82.41,123.47,98];mtimer=setInterval(()=>{if(!S.music)return;const f=notes[mstep++%notes.length];tone(f,.13,.025*intensity,'triangle',mgain);if(mstep%2===0)tone(f*2,.055,.011*intensity,'sine',mgain)},300)}function setIntensity(s){intensity=['laser','vaultCode','vaultCircuit'].includes(s)?1.55:['synthesis','formal','ending'].includes(s)?.75:1}function sfx(f=440,d=.04){if(!S.sfx)return;audio();tone(f,d,.035,'sine',ac.destination)}
el('musicBtn').onclick=()=>{S.music=!S.music;el('musicBtn').textContent=S.music?'MÚSICA: ON':'MÚSICA: OFF';if(S.music){musicStart();if(mgain)mgain.gain.value=.052}else if(mgain)mgain.gain.value=0};el('sfxBtn').onclick=()=>{S.sfx=!S.sfx;el('sfxBtn').textContent=S.sfx?'SFX: ON':'SFX: OFF'};el('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('O navegador bloqueou a tela cheia.')}};function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
render();updateTop();
